<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="晴れゴルフ">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>晴れゴルフ場さがし</title>
<style>
  :root{
    --bg:#f4f6f3; --card:#fff; --ink:#1d2621; --sub:#5d6b63; --line:#dfe5e0;
    --green:#1f6f4a; --green-soft:#e3f1e9; --amber:#a86a00; --amber-soft:#fbf0d9;
    --red:#b23a3a; --red-soft:#f8e2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  header{background:var(--green);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 14px}
  header h1{margin:0;font-size:20px;letter-spacing:.02em}
  header p{margin:4px 0 0;font-size:12px;opacity:.85}
  main{max-width:720px;margin:0 auto;padding:12px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  label{display:block;font-size:12px;color:var(--sub);margin:0 0 4px}
  select,input[type=date]{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none;min-height:44px}
  .defrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--sub)}
  .defrow button{font-size:13px;padding:6px 10px;min-height:34px;border:1px solid var(--green);color:var(--green);background:#fff;border-radius:999px}
  .defrow button:disabled{border-color:var(--line);color:var(--sub)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .row3{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-top:10px}
  .row3 .tilde{padding-bottom:12px;color:var(--sub)}
  .opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px;font-size:14px}
  .opts select{width:auto;min-height:36px;padding:6px 10px;font-size:15px}
  .chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0}
  .chk input{width:20px;height:20px}
  button.go{width:100%;margin-top:14px;min-height:48px;font-size:17px;font-weight:700;color:#fff;background:var(--green);border:0;border-radius:12px}
  button.go:disabled{opacity:.5}
  .msg{margin:12px 2px;font-size:14px;color:var(--sub)}
  .err{color:var(--red)}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 10px;position:sticky;top:0;z-index:2;background:var(--bg);padding:6px 0}
  .tab{min-height:44px;font-size:14px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--sub)}
  .tab.on.t0{background:var(--green);border-color:var(--green);color:#fff}
  .tab.on.t1{background:var(--amber);border-color:var(--amber);color:#fff}
  .tab.on.t2{background:var(--red);border-color:var(--red);color:#fff}
  .pill{font-size:13px;padding:4px 10px;border-radius:999px;font-weight:600}
  .ok{background:var(--green-soft);color:var(--green)}
  .mid{background:var(--amber-soft);color:var(--amber)}
  .ng{background:var(--red-soft);color:var(--red)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .name{font-weight:700;font-size:16px;line-height:1.35}
  .name a{color:inherit;text-decoration:none}
  .name a::after{content:" ↗";font-size:12px;color:var(--sub)}
  .stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub);margin-top:6px}
  .stats b{color:var(--ink);font-weight:600}
  .links{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .links a{flex:1 1 0;min-width:120px;text-align:center;font-size:13px;font-weight:600;padding:8px 6px;border-radius:10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:#fff}
  .hours{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  .h{flex:0 0 auto;min-width:44px;text-align:center;font-size:11px;color:var(--sub);background:var(--bg);border-radius:8px;padding:4px 2px}
  .h .ic{font-size:18px;line-height:1.3}
  .h.wet{background:var(--red-soft);color:var(--red)}
  footer{font-size:11px;color:var(--sub);text-align:center;padding:18px 12px 28px;line-height:1.6}
  footer a{color:var(--sub)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>⛳ 晴れゴルフ場さがし</h1>
  <p>都道府県・日付・時間を選ぶと、その時間に雨が降らなそうなゴルフ場を表示します</p>
</header>
<main>
  <form class="panel" id="form">
    <label for="pref">都道府県</label>
    <select id="pref"></select>
    <div class="defrow">
      <span id="defNote"></span>
      <button type="button" id="setDef">★ この都道府県をいつもの設定にする</button>
    </div>

    <div class="row">
      <div style="grid-column:1/-1">
        <label for="date">日付（今日から16日先まで）</label>
        <input type="date" id="date">
      </div>
    </div>

    <div class="row3">
      <div><label for="start">開始時間</label><select id="start"></select></div>
      <div class="tilde">〜</div>
      <div><label for="end">終了時間</label><select id="end"></select></div>
    </div>

    <div class="opts">
      <span>雨の判定：降水確率
        <select id="thr">
          <option value="10">10%</option>
          <option value="20">20%</option>
          <option value="30" selected>30%</option>
          <option value="40">40%</option>
          <option value="50">50%</option>
        </select> 以下</span>
    </div>

    <button class="go" id="go" type="submit">晴れのゴルフ場をさがす</button>
  </form>

  <div id="status" class="msg"></div>
  <div id="summary" class="tabs" role="tablist"></div>
  <div id="list"></div>
</main>
<footer>
  天気予報：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>（気象庁などの予報モデル）／
  ゴルフ場データ：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors<br>
  地図データに載っていないゴルフ場は表示されません。予報は目安です。
</footer>

<script>
(function(){
  const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
  const OVERPASS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"
  ];
  const HARD = /(練習|打ちっぱなし|打ちっ放し|ターゲットバード|パークゴルフ|グラウンド・?ゴルフ|グランドゴルフ|グラウンド•ゴルフ|ground golf|マレット|ゲートボール|GOLFERS24|ドライビングレンジ|driving range|打席|ミニゴルフ|パターゴルフ|インドア|シミュレーション|シミュレーター|ゴルフスタジオ|golf studio|ゴルフスペース|ゴルフパートナー|ステップゴルフ|SMART GOLF|Round1|Asobi-bar)/i;
  const COURSE = /(カントリー|ＣＣ|(?<![A-Z])CC|C\.C|倶楽部|俱楽部|ゴルフコース|Golf Course|Golf Club|リンクス|Links|ＧＣ|(?<![A-Z])GC|G\.C|ゴルフリゾート|ゴルフ[&＆]リゾート|Golf ?[&＆] ?Resort|Course|コース|ゴルフクラブ)/i;
  const RANGE = /(ゴルフセンター|Gセンター|Golf ?Center|ガーデン|GARDEN|プラザ|PLAZA|レンジ|レインジ|RANGE|ドーム|広場|ゴルフパーク|GOLF PARK|ゴルフランド|ロングゴルフ|ゴルフレーン|LANE|スイング|SWING|24|ゴルフビレッジ|スタジアム|グリーンゴルフ|ゴルフ$|GOLF$|Golf$)/i;
  const isCourse = n => !HARD.test(n) && (COURSE.test(n) || !RANGE.test(n));
  const $ = id => document.getElementById(id);

  // ---- storage helpers (may be unavailable) ----
  const store = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  // ---- form setup ----
  PREFS.forEach((p,i)=>{
    const o=document.createElement("option");
    o.value=String(i+1).padStart(2,"0"); o.textContent=p; $("pref").appendChild(o);
  });
  const DEFAULT_PREF = "03"; // 岩手県
  const settings = Object.assign({defaultPref: DEFAULT_PREF}, store.get("gw-settings") || {});
  delete settings.pref; // 旧版の「前回の都道府県」は使わない
  if(!PREFS[+settings.defaultPref-1]) settings.defaultPref = DEFAULT_PREF;
  function saveSettings(){ store.set("gw-settings", settings); }
  $("pref").value = settings.defaultPref;
  if(settings.thr) $("thr").value = settings.thr;
  function updateDefUI(){
    $("defNote").textContent = "いつもの設定：" + PREFS[+settings.defaultPref-1];
    const same = $("pref").value === settings.defaultPref;
    $("setDef").disabled = same;
    $("setDef").textContent = same ? "✓ いつもの都道府県です" : "★ この都道府県をいつもの設定にする";
  }
  $("pref").addEventListener("change", updateDefUI);
  $("setDef").addEventListener("click", ()=>{ settings.defaultPref = $("pref").value; saveSettings(); updateDefUI(); });
  updateDefUI();

  function timeLabel(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
  for(let m=5*60; m<=20*60; m+=30){
    [$("start"),$("end")].forEach(sel=>{
      const o=document.createElement("option"); o.value=m; o.textContent=timeLabel(m); sel.appendChild(o);
    });
  }
  $("start").value = 8*60;
  $("end").value = 16*60;

  function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  const today = new Date(); const maxD = new Date(); maxD.setDate(today.getDate()+15);
  $("date").min = ymd(today); $("date").max = ymd(maxD);
  const tmr = new Date(); tmr.setDate(today.getDate()+1);
  $("date").value = ymd(tmr);

  // ---- weather code ----
  function wIcon(c){
    if(c===0) return "☀️";
    if(c===1||c===2) return "🌤️";
    if(c===3) return "☁️";
    if(c===45||c===48) return "🌫️";
    if(c>=51&&c<=57) return "🌦️";
    if((c>=61&&c<=67)||(c>=80&&c<=82)) return "🌧️";
    if((c>=71&&c<=77)||c===85||c===86) return "🌨️";
    if(c>=95) return "⛈️";
    return "・";
  }
  function isWetCode(c){ return (c>=51&&c<=67)||(c>=71&&c<=86)||c>=95; }

  // ---- golf courses from OpenStreetMap ----
  async function fetchCourses(prefCode){
    const key="gw-courses-"+prefCode;
    const c=store.get(key);
    if(c && c.v===2 && Date.now()-c.t < 30*24*3600*1000 && c.list && c.list.length) return c.list.filter(x=>isCourse(x.name));
    // 1) アプリに同梱した一覧（毎月自動更新）を読む。速い。
    try{
      const res=await fetch("courses/"+prefCode+".json",{cache:"no-cache"});
      if(res.ok){
        const list=await res.json();
        if(Array.isArray(list) && list.length){ const l=list.filter(x=>isCourse(x.name)); store.set(key,{v:2,t:Date.now(),list:l}); return l; }
      }
    }catch(e){}
    // 2) 同梱データがなければ OpenStreetMap に直接問い合わせる（遅い）
    const q = `[out:json][timeout:90];area["ISO3166-2"="JP-${prefCode}"]["admin_level"="4"]->.a;(way["leisure"="golf_course"](area.a);relation["leisure"="golf_course"](area.a);node["leisure"="golf_course"](area.a););out center tags;`;
    let lastErr;
    for(const ep of OVERPASS){
      try{
        const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),60000);
        let res;
        try{ res = await fetch(ep, {method:"POST", body:"data="+encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}, signal:ctl.signal}); }
        finally{ clearTimeout(timer); }
        if(!res.ok) throw new Error("HTTP "+res.status);
        const js = await res.json();
        let list = parseCourses(js.elements||[]);
        if(!list.length && !q.includes('"name"=')){ // ISOコードのない県は名前で再検索
          const q2=q.replace(`area["ISO3166-2"="JP-${prefCode}"]`,`area["name"="${PREFS[+prefCode-1]}"]`);
          const r2=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q2),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
          if(r2.ok) list=parseCourses((await r2.json()).elements||[]);
        }
        store.set(key,{v:2,t:Date.now(),list});
        return list;
      }catch(e){ lastErr=e; }
    }
    throw new Error("ゴルフ場データを取得できませんでした（"+(lastErr&&lastErr.message||"通信エラー")+"）");
  }
  function parseCourses(els){
    const byName=new Map();
    for(const e of els){
      const t=e.tags||{};
      const name=(t["name:ja"]||t.name||"").trim();
      if(!name || !isCourse(name) || t.golf==="driving_range") continue;
      const lat = e.lat ?? (e.center&&e.center.lat);
      const lon = e.lon ?? (e.center&&e.center.lon);
      if(lat==null||lon==null) continue;
      if(!byName.has(name)) byName.set(name,{name,lat,lon,n:1,web:t.website||t["contact:website"]||""});
      else{ const o=byName.get(name); o.lat=(o.lat*o.n+lat)/(o.n+1); o.lon=(o.lon*o.n+lon)/(o.n+1); o.n++; }
    }
    return [...byName.values()].map(o=>({name:o.name,lat:+o.lat.toFixed(4),lon:+o.lon.toFixed(4),web:o.web}));
  }

  // ---- weather from Open-Meteo ----
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function getJSON(url, tries){
    let lastErr;
    for(let t=0;t<tries;t++){
      const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),12000);
      try{
        const res=await fetch(url,{signal:ctl.signal,cache:"no-store"});
        if(!res.ok){
          let reason=""; try{ reason=(await res.json()).reason||""; }catch(e){}
          lastErr=new Error("HTTP "+res.status+(reason?" "+reason:""));
          if(res.status>=400 && res.status<500 && res.status!==429) throw lastErr; // 条件の誤りは再試行しない
        }else{
          return await res.json();
        }
      }catch(e){
        lastErr = e.name==="AbortError" ? new Error("タイムアウト") : e;
        if(/^HTTP 4(?!29)/.test(lastErr.message)) throw lastErr;
      }finally{ clearTimeout(timer); }
      if(t<tries-1) await sleep(800*(t+1));
    }
    throw lastErr;
  }
  // GitHub上で1日3回まとめて取得した予報（weather/XX.json）を使う。速くて確実。
  async function fetchPrebuilt(prefCode, courses, date){
    try{
      const res=await fetch("weather/"+prefCode+".json",{cache:"no-cache"});
      if(!res.ok) return null;
      const js=await res.json();
      const age=Date.now()-new Date(js.generated).getTime();
      if(!(age < 14*3600*1000)) return null;                       // 古すぎる
      const per=js.hTo-js.hFrom+1;
      const day=Math.round((new Date(date+"T00:00:00+09:00")-new Date(js.start+"T00:00:00+09:00"))/86400000);
      if(day<0 || (day+1)*per > js.rows[0].p.length) return null;  // 範囲外
      const idx=new Map(js.names.map((n,i)=>[n,i]));
      const times=[]; for(let h=js.hFrom;h<=js.hTo;h++) times.push(date+"T"+String(h).padStart(2,"0")+":00");
      const sl=a=>a.slice(day*per,(day+1)*per);
      const out=courses.map(c=>{
        const i=idx.get(c.name); if(i==null) return null;
        const r=js.rows[i];
        return {hourly:{time:times, precipitation:sl(r.p).map(v=>v==null?null:v/10), precipitation_probability:sl(r.pp),
          weather_code:sl(r.c), temperature_2m:sl(r.t), wind_speed_10m:sl(r.w)}};
      });
      const miss=out.filter(x=>!x).length;
      if(miss===out.length) return null;
      out.failed=miss; out.generated=js.generated;
      return out;
    }catch(e){ return null; }
  }

  async function fetchWeather(courses, date){
    // 30分以内に同じ県・日付で取った天気は使い回す
    const wkey="gw-weather-"+date+"-"+courses.length+"-"+courses[0].lat;
    const cached=store.get(wkey);
    if(cached && Date.now()-cached.t < 30*60*1000 && cached.list.length===courses.length) return cached.list;
    const out=new Array(courses.length).fill(null); const CH=20; let failed=0, lastErr=null, done=0;
    const jobs=[];
    for(let i=0;i<courses.length;i+=CH) jobs.push(i);
    async function run(i){
      const part=courses.slice(i,i+CH);
      const url="https://api.open-meteo.com/v1/forecast?latitude="+part.map(c=>c.lat).join(",")+
        "&longitude="+part.map(c=>c.lon).join(",")+
        "&hourly=precipitation,precipitation_probability,weather_code,temperature_2m,wind_speed_10m"+
        "&timezone=Asia%2FTokyo&wind_speed_unit=ms&start_date="+date+"&end_date="+date;
      try{
        const js=await getJSON(url,3);
        const arr=Array.isArray(js)?js:[js];
        arr.forEach((w,k)=>{ out[i+k]=w; });
      }catch(e){ failed+=part.length; lastErr=e; }
      done+=part.length;
      setStatus(`<span class="spinner"></span>天気を確認中… ${done} / ${courses.length}`);
    }
    // 3本ずつ同時に問い合わせる
    const workers=[0,1,2].map(async()=>{ while(jobs.length){ await run(jobs.shift()); } });
    await Promise.all(workers);
    if(failed===courses.length){
      throw new Error("天気予報サーバー（Open-Meteo）に接続できませんでした（"+(lastErr&&lastErr.message||"通信エラー")+"）");
    }
    if(!failed) store.set(wkey,{t:Date.now(),list:out});
    out.failed=failed;
    return out;
  }

  // Open-Meteo hourly precip = "preceding hour". Label h covers (h-1):00〜h:00.
  function evaluate(w, startMin, endMin, thr){
    const H=w.hourly; const hours=[];
    const hFrom=Math.floor(startMin/60)+1, hTo=Math.ceil(endMin/60);
    for(let idx=0; idx<H.time.length; idx++){
      const h=parseInt(H.time[idx].slice(11,13),10);
      if(h>=hFrom && h<=hTo){
        hours.push({h, p:H.precipitation[idx]??0, pp:H.precipitation_probability[idx], c:H.weather_code[idx], t:H.temperature_2m[idx], ws:H.wind_speed_10m[idx]});
      }
    }
    if(!hours.length) return null;
    const sum=hours.reduce((a,x)=>a+(x.p||0),0);
    const pps=hours.map(x=>x.pp).filter(v=>v!=null);
    const maxPP=pps.length?Math.max(...pps):null;
    const temps=hours.map(x=>x.t).filter(v=>v!=null);
    const winds=hours.map(x=>x.ws).filter(v=>v!=null);
    const anyWetCode=hours.some(x=>isWetCode(x.c));
    let grade;
    if(sum<0.1 && (maxPP==null||maxPP<=thr) && !anyWetCode) grade=0;      // 雨なし
    else if(sum<1 && (maxPP==null||maxPP<=50)) grade=1;                    // 微妙
    else grade=2;                                                          // 雨
    return {hours,sum,maxPP,tMin:Math.min(...temps),tMax:Math.max(...temps),wMax:winds.length?Math.max(...winds):null,grade};
  }

  // ---- UI ----
  function setStatus(html,isErr){ $("status").innerHTML=html; $("status").className="msg"+(isErr?" err":""); }
  function esc(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  let last=null, tab=0;
  const gs=q=>"https://www.google.com/search?q="+encodeURIComponent(q);
  function render(){
    if(!last) return;
    const {rows,prefName,date,startMin,endMin}=last;
    const cnt=[0,0,0]; rows.forEach(r=>cnt[r.ev.grade]++);
    const names=["☀️ 雨なし","🌥️ 微妙","☔ 雨"];
    $("summary").innerHTML=names.map((n,i)=>`<button type="button" role="tab" class="tab t${i}${tab===i?" on":""}" data-tab="${i}" aria-selected="${tab===i}">${n} ${cnt[i]}</button>`).join("");
    const show=rows.filter(r=>r.ev.grade===tab);
    setStatus(`${prefName}・${date.replace(/-/g,"/")}・${timeLabel(startMin)}〜${timeLabel(endMin)}：全${rows.length}か所`);
    if(!show.length){
      const emp=["雨なしのゴルフ場は見つかりませんでした。判定の降水確率を上げるか、「微妙」タブも見てみてください。","「微妙」のゴルフ場はありません。","雨のゴルフ場はありません。"];
      $("list").innerHTML=`<div class="card">${emp[tab]}</div>`;
      return;
    }
    const labels=["雨なし","微妙","雨"], cls=["ok","mid","ng"];
    $("list").innerHTML=show.map(r=>{
      const e=r.ev;
      const map="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.c.name+" "+prefName);
      const hrs=e.hours.map(x=>`<div class="h${(x.p>=0.1||isWetCode(x.c))?" wet":""}"><div>${x.h-1}時</div><div class="ic">${wIcon(x.c)}</div><div>${x.pp!=null?x.pp+"%":"-"}</div></div>`).join("");
      return `<div class="card">
        <div class="top"><div class="name"><a href="${map}" target="_blank" rel="noopener">${esc(r.c.name)}</a></div>
        <span class="pill ${cls[e.grade]}">${labels[e.grade]}</span></div>
        <div class="stats">
          <span>降水確率 最大 <b>${e.maxPP!=null?e.maxPP+"%":"-"}</b></span>
          <span>雨量 <b>${e.sum.toFixed(1)}mm</b></span>
          <span>気温 <b>${Math.round(e.tMin)}〜${Math.round(e.tMax)}℃</b></span>
          ${e.wMax!=null?`<span>風 最大 <b>${e.wMax.toFixed(0)}m/s</b></span>`:""}
        </div>
        <div class="hours">${hrs}</div>
        <div class="links">
          <a href="${gs(r.c.name+" ゴル天 天気")}" target="_blank" rel="noopener">⛳ ゴル天</a>
          <a href="${gs("site:weathernews.jp/golf "+r.c.name)}" target="_blank" rel="noopener">🌤️ ウェザーニュース</a>
        </div>
      </div>`;
    }).join("");
  }

  $("summary").addEventListener("click",e=>{
    const b=e.target.closest(".tab"); if(!b) return;
    tab=+b.dataset.tab; render();
  });
  $("thr").addEventListener("change",()=>{
    if(!last) return;
    const thr=+$("thr").value;
    last.rows.forEach(r=>{ r.ev=evaluate(r.w,last.startMin,last.endMin,thr); });
    sortRows(last.rows); render();
    settings.thr=$("thr").value; saveSettings();
  });
  function sortRows(rows){
    rows.sort((a,b)=>a.ev.grade-b.ev.grade || (a.ev.maxPP??0)-(b.ev.maxPP??0) || a.ev.sum-b.ev.sum || a.c.name.localeCompare(b.c.name,"ja"));
  }

  $("form").addEventListener("submit", async ev=>{
    ev.preventDefault();
    const prefCode=$("pref").value, prefName=PREFS[+prefCode-1];
    const date=$("date").value, startMin=+$("start").value, endMin=+$("end").value, thr=+$("thr").value;
    $("summary").innerHTML=""; $("list").innerHTML="";
    if(!date){ setStatus("日付を選んでください。",true); return; }
    if(date<$("date").min || date>$("date").max){ setStatus("日付は今日から16日先までで選んでください。",true); return; }
    if(endMin<=startMin){ setStatus("終了時間は開始時間より後にしてください。",true); return; }
    settings.thr=$("thr").value; saveSettings();
    $("go").disabled=true;
    try{
      setStatus(`<span class="spinner"></span>${prefName}のゴルフ場を探しています…（初回は数十秒かかることがあります）`);
      const t0=performance.now();
      const courses=await fetchCourses(prefCode);
      const t1=performance.now();
      if(!courses.length){ setStatus(prefName+"のゴルフ場データが見つかりませんでした。",true); return; }
      setStatus(`<span class="spinner"></span>天気を確認中… 0 / ${courses.length}`);
      const ws=(await fetchPrebuilt(prefCode,courses,date)) || (await fetchWeather(courses,date));
      const t2=performance.now();
      const rows=[];
      courses.forEach((c,i)=>{ const w=ws[i]; if(!w||!w.hourly) return; const e=evaluate(w,startMin,endMin,thr); if(e) rows.push({c,w,ev:e}); });
      sortRows(rows);
      last={rows,prefCode,prefName,date,startMin,endMin}; tab=0;
      render();
      $("status").innerHTML+=`<br><small>（ゴルフ場 ${((t1-t0)/1000).toFixed(1)}秒・天気 ${((t2-t1)/1000).toFixed(1)}秒）</small>`;
      if(ws.generated) $("status").innerHTML+=`<small>　予報の取得：${ws.generated.slice(5,10).replace('-','/')} ${ws.generated.slice(11,16)}</small>`;
      if(ws.failed) $("status").innerHTML+=`<br><span class="err">※ ${ws.failed}か所は天気を取得できず、一覧から外しています。</span>`;
    }catch(e){
      setStatus(esc(e.message||"エラーが発生しました")+"。電波の良い場所で、少し時間をおいて試してください。",true);
    }finally{
      $("go").disabled=false;
    }
  });
})();
</script>
<script>
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
</script>
</body>
</html>
