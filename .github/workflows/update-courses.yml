name: ゴルフ場データ更新

on:
  workflow_dispatch:
    inputs:
      prefs:
        description: "対象の県コード（空欄=全県、例: 03 22）"
        required: false
        default: ""
  schedule:
    - cron: "17 18 1 * *" # 毎月2日 03:17（日本時間）

permissions:
  contents: write

concurrency:
  group: update-courses
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenStreetMapからゴルフ場を取得
        env:
          PREFS: ${{ github.event.inputs.prefs }}
        run: python -u tools/build_courses.py
      - name: 変更があれば保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add courses
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ゴルフ場データを更新"
            git push origin HEAD:main
          fi
