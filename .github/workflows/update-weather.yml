name: 天気予報の更新と公開

# 天気予報をまとめて取得し、アプリ一式と一緒に gh-pages ブランチへ公開する。
# gh-pages は毎回1コミットだけに置き換えるので、履歴が増え続けない。
# main への push（アプリ更新）では天気は取り直さず、前回の予報をそのまま使う（無料枠の節約）。
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 20 * * *" # 05:23（日本時間）
    - cron: "23 2 * * *"  # 11:23
    - cron: "23 9 * * *"  # 18:23

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 前回の天気予報を取り出す
        run: |
          git fetch --depth=1 origin gh-pages && git checkout FETCH_HEAD -- weather || mkdir -p weather
      - name: 天気予報を取得（定時・手動実行のとき。失敗した県は前回分のまま）
        if: github.event_name != 'push'
        run: python -u tools/build_weather.py
      - name: gh-pages に公開
        run: |
          mkdir -p /tmp/site
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png apple-touch-icon.png /tmp/site/
          cp -r courses weather /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "公開: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
